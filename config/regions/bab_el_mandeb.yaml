# Region overlay: Bab el-Mandeb — the one region where routing is ACTIVE.
#
# Structure mirrors config/settings.yaml's key paths; see hormuz.yaml's header
# for the overlay mapping. Agent keys are the pipeline's real config keys
# (natural_disaster, news_sentiment).
region:
  name: bab_el_mandeb
  display_name: "Bab el-Mandeb"
  # Matches BOTH config/benchmark/bab_el_mandeb.yaml's centre point AND
  # settings.yaml's existing "Bab el-Mandeb" monitoring point — one
  # coordinate per chokepoint across the codebase.
  latitude: 12.58
  longitude: 43.33

agents:
  shipping:
    enabled: true
  market:
    enabled: true
  geopolitical:
    enabled: true
  natural_disaster:
    # PASSIVE — evidence-excluded, not missing data.
    # config/benchmark/bab_el_mandeb.yaml: disaster_relevance: none —
    # "No natural-hazard driver applies to this event ... a
    # security/geopolitical campaign, not a natural disaster." This is an
    # affirmative absence found in the region's evidence review.
    enabled: false
  routing:
    # PASSIVE — by temporary GLOBAL muting, NOT because the evidence is weak.
    # See the "ROUTING AGENT: GLOBALLY PASSIVE" block in src/core/regions.py
    # for the full rationale and its caveat.
    #
    # This region's routing evidence is the strongest in the benchmark: 85% of
    # large (7,500+ TEU) containerships diverted via the Cape of Good Hope by
    # end-Dec 2023 (+3,500-4,000 nm / +10-14 days per voyage) — genuine route
    # DEVIATION, which is what the AIS-deviation model detects, and a literal
    # documented percentage rather than an extrapolation
    # (docs/eval01-archived/EVIDENCE_PROVENANCE.md). On evidence alone this
    # would be the one region with routing ACTIVE.
    #
    # It is muted anyway, to defer per-region muting decisions to
    # post-evaluation. Supporting note: routing_connector.fetch_api() is still
    # a NotImplementedError stub, so enabling it would select the synthetic or
    # CSV path, not live diversion data.
    #
    # If routing is revisited, re-enable THIS region first.
    enabled: false
  news_sentiment:
    enabled: true
    # AUTHORED (not copied from settings.yaml, which only has Hormuz's block).
    # countries follow the region's own documented conflict geography;
    # topics adapt Hormuz's list to the Houthi-campaign context.
    location_context:
      primary_location: "Bab el-Mandeb"
      region: "Red Sea"
      countries: ["Yemen", "Djibouti", "Saudi Arabia", "Egypt"]
      topics: ["shipping", "tanker", "Houthi", "rerouting", "Cape of Good Hope", "military"]

# INTENTIONAL SCOPE MISMATCH — the two geographic scopes below differ on
# purpose, and a loader must not "reconcile" them into one box:
#
#   extraction.chokepoint_key: "red_sea"  -> lat 12-30 N, the WHOLE Red Sea
#   aisstream.bbox                        -> lat 11.8-13.4 N, the STRAIT only
#
# Rationale: the two scopes feed different agents with different needs.
#   - Extraction (ACLED events, news sweeps) feeds the geopolitical and
#     news_sentiment agents, which need REGIONAL context — the Houthi campaign
#     driving this chokepoint plays out across the whole Red Sea corridor and
#     into Yemen, not within sight of the strait.
#   - AIS feeds shipping/routing, which measure transits THROUGH the
#     chokepoint itself; widening that box to the full Red Sea would count
#     vessels that never approach Bab el-Mandeb.
#
# Also note the key-name mismatch: settings.yaml's existing chokepoint entry
# for this corridor is "red_sea", not "bab_el_mandeb". countries and
# bounding_box below are that entry verbatim.
extraction:
  # Renamed from red_sea when extraction.chokepoints was aligned with the
  # region registry; the wide whole-Red-Sea box below is unchanged.
  chokepoint_key: bab_el_mandeb
  countries: ["Yemen", "Saudi Arabia", "Egypt", "Eritrea", "Djibouti", "Sudan", "Somalia"]
  bounding_box: { lat_min: 12.0, lat_max: 30.0, lon_min: 32.0, lon_max: 44.0 }

# DERIVED, not sourced: a ~1.5-degree box centred on the strait's own
# documented coordinate (12.58, 43.33) above — deliberately narrower than the
# extraction bbox, per the scope-mismatch note. settings.yaml has no aisstream
# monitor region for this corridor, so there is nothing to copy verbatim.
aisstream:
  bbox: [[11.8, 42.6], [13.4, 44.1]]

# No per-region market block — see hormuz.yaml's closing note.

# IMF PortWatch chokepoint name, as spelled in the Daily_Chokepoints_Data
# feature layer. Drives ShippingConnector.fetch_from_api(); the layer carries
# daily transit counts per chokepoint from 2019-01-01 to the present.
ingestion:
  shipping:
    portwatch_chokepoint: "Bab el-Mandeb Strait"
