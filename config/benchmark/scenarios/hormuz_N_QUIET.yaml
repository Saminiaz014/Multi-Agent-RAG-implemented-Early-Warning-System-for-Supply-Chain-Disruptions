# N-QUIET: calm baseline year, no event at all. Every domain is
# enabled-but-silent (effect: null) — a pure negative control.
#
# Why `event` is a full all-zero block instead of `event: null`: the
# loader (src/benchmark/scenario_generator.py:load_scenario) requires
# `event` to be a mapping with onset_day/ramp_days/duration_days/peak_band
# — `event: null` raises a clear ValueError pointing back at this file.
# The four fields below are syntactically required but functionally inert
# here: this scenario's `class` doesn't start with "P" (so
# _ground_truth_labels never reads them) and every signal's `effect` is
# null (so materialize_scenario never reads them either). If you're
# copying this file for a new region's "no event" scenario, keep this
# same all-zero + peak_band: none pattern — don't try event: null.
scenario_id: hormuz_N_QUIET
region: hormuz
class: N-QUIET
seed: 42
days: 365
event:
  onset_day: 0
  ramp_days: 0
  duration_days: 0
  peak_band: none
signals:
  shipping: {baseline: {mean: 70, std: 5}, effect: null}
  market: {baseline: {mean: 0.0, std: 1.0}, effect: null}
  geopolitical: {baseline: {mean: 0.05, std: 0.02}, effect: null}
  routing: {baseline: {mean: 0.08, std: 0.03}, effect: null}
  news: {baseline: {mean: 0.15, std: 0.08}, effect: null}
  disaster: {baseline: {mean: 0.02, std: 0.01}, effect: null}
noise:
  autocorrelation: 0.35
  seasonality: {period: 365, amplitude: 0.08}
  missing_data_rate: 0.02
